spring.application.name=overflow
spring.datasource.url=jdbc:mysql://localhost:3306/overflow_db
spring.datasource.username=overflow_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.error.include-message=never

# Optional first-admin bootstrap. Set these as local environment variables; never commit actual values.
overflow.bootstrap.admin.name=${OVERFLOW_ADMIN_NAME:}
overflow.bootstrap.admin.email=${OVERFLOW_ADMIN_EMAIL:}
overflow.bootstrap.admin.password=${OVERFLOW_ADMIN_PASSWORD:}
